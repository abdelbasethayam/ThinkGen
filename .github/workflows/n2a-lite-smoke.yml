name: N2A Lite smoke check

on:
  push:
    branches: [n2a-lite]
    paths:
      - "n2a_lite/**"
      - ".github/workflows/n2a-lite-smoke.yml"
  workflow_dispatch:

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: python -m pip install -r n2a_lite/requirements.txt
      - name: Compile application
        run: python -m py_compile n2a_lite/app.py
      - name: Verify imports
        run: python -c "import streamlit, pandas; print('N2A Lite imports OK')"
