name: Bozza Android APK

on:
  push:
    branches:
      - bozza-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct Bozza Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bozza-source"
          cat .bozza-build/part-*.b64 | base64 --decode > "$RUNNER_TEMP/bozza-android.tar.gz"
          tar -tzf "$RUNNER_TEMP/bozza-android.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/bozza-android.tar.gz" -C "$RUNNER_TEMP/bozza-source"
          test -f "$RUNNER_TEMP/bozza-source/android/app/build.gradle"
          test -f "$RUNNER_TEMP/bozza-source/android/app/src/main/AndroidManifest.xml"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Bozza debug APK
        working-directory: ${{ runner.temp }}/bozza-source/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/bozza-source/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BOZZA-debug-apk
          path: ${{ runner.temp }}/bozza-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
